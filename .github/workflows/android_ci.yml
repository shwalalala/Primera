name: Android CI

on:
  push:
    branches: [ "main", "develop", "feature/*", "chore/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Gradle Build
        run: ./gradlew clean --no-daemon

      - name: Run Checks & Build
        run: |
          ./gradlew lintDebug testDebugUnitTest assembleDebug \
            --parallel \
            --build-cache \
            --no-daemon \
            --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to Firebase App Distribution
        if: github.ref == 'refs/heads/main' && success()
        uses: wzieba/Firebase-Distribution-Github-Action@v2
        with:
          appId: 1:520407937883:android:2503659c8fc383404f607e
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "Automated build from GitHub commit ${{ github.sha }}"